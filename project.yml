name: SessionLens
options:
  bundleIdPrefix: fr.dcreations
  deploymentTarget: { iOS: "17.0", macOS: "15.0" }
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Session Lens"
    INFOPLIST_KEY_CFBundleIconName: "AppIcon"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
targets:
  SessionLens:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: fr.dcreations.sessionlens
      PRODUCT_NAME: SessionLens
      TARGETED_DEVICE_FAMILY: "1,2"
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 dcreations. Apache-2.0."
  SessionLensMac:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: fr.dcreations.sessionlens
      PRODUCT_NAME: "Session Lens"
      PRODUCT_MODULE_NAME: SessionLens
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
      ENABLE_APP_SANDBOX: YES
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_ENTITLEMENTS: SessionLens.entitlements
      INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 dcreations. Apache-2.0."
  SessionLensTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{ target: SessionLens }]
    settings:
      TARGETED_DEVICE_FAMILY: "1,2"
  SessionLensUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{ target: SessionLens }]
    settings:
      TEST_TARGET_NAME: SessionLens
      TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  SessionLens:
    build: { targets: { SessionLens: all } }
    test: { targets: [SessionLensTests, SessionLensUITests] }
  SessionLensMac:
    build: { targets: { SessionLensMac: all } }
